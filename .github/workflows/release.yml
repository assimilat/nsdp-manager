# Cross-platform release builds.
#
# Trigger by pushing a tag like v0.1.0. Produces, for Linux/macOS/Windows:
#   - the standalone `prosafe` CLI/TUI binary
#   - the Tauri desktop app bundle (.deb/.AppImage, .dmg, .msi/.exe)
# and attaches them to a release for that tag.
#
# The file uses GitHub Actions syntax. Forgejo Actions reads .github/workflows
# too, so this also runs on the Forgejo mirror once a runner is registered;
# there, ${{ github.* }} contexts are provided by Forgejo as well.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- standalone Go CLI/TUI, cross-compiled ------------------------------
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: Build prosafe
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          out="prosafe-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/prosafe
          echo "ASSET=$out" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ASSET }}

  # ---- Tauri desktop app, native per OS -----------------------------------
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,  triple: x86_64-unknown-linux-gnu,  goos: linux,   goarch: amd64, ext: "" }
          - { os: macos-14,      triple: aarch64-apple-darwin,      goos: darwin,  goarch: arm64, ext: "" }
          - { os: macos-13,      triple: x86_64-apple-darwin,       goos: darwin,  goarch: amd64, ext: "" }
          - { os: windows-latest, triple: x86_64-pc-windows-msvc,   goos: windows, goarch: amd64, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.triple }}" }
      - name: Linux system dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf build-essential curl wget file
      - name: Build Go sidecar for this target
        working-directory: desktop
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o "src-tauri/binaries/prosafe-server-${{ matrix.triple }}${{ matrix.ext }}" ../cmd/prosafe
      - name: Install frontend deps
        working-directory: desktop
        run: npm ci || npm install
      - name: Build and release the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "ProSAFE Plus ${{ github.ref_name }}"
          releaseDraft: false
          args: --target ${{ matrix.triple }}
